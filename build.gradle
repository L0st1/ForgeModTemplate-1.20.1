buildscript {
    def mixinRequested = (project.findProperty('enable_mixin') ?: 'false').toBoolean()
    if (mixinRequested) {
        repositories {
            maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
            mavenCentral()
        }
        dependencies {
            classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
        }
    }
}

plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'com.diffplug.spotless' version '8.10.0'
    id 'pmd'
    id 'eclipse'
    id 'maven-publish'
}

group = mod_group
version = mod_version

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

def mixinEnabled = providers.gradleProperty('enable_mixin').map { it.toBoolean() }.getOrElse(false)

if (mixinEnabled) {
    apply plugin: 'org.spongepowered.mixin'
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {}

        server {
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

spotless {
    java {
        target 'src/*/java/**/*.java', 'template/**/*.java.template'
        googleJavaFormat('1.28.0').skipJavadocFormatting()
    }
}

pmd {
    toolVersion = '7.24.0'
    consoleOutput = true
    ruleSets = ['category/java/errorprone.xml']
    rulesMinimumPriority = 3
}

tasks.withType(org.gradle.api.plugins.quality.Pmd).configureEach {
    // High-confidence source rules do not require Forge's generated compile classpath.
    classpath = files()
    reports {
        xml.required = false
        html.required = true
    }
}

tasks.register('qualityCheck') {
    group = 'verification'
    description = 'Runs Java formatting and static-analysis checks.'
    dependsOn 'spotlessCheck', 'pmdMain', 'pmdTest'
}

tasks.named('check') {
    dependsOn tasks.named('spotlessCheck')
}

tasks.register('installGitHooks') {
    group = 'setup'
    description = 'Configures this repository to use the versioned Git hooks.'
    doLast {
        def hook = file('.githooks/pre-commit')
        if (!hook.isFile()) {
            throw new GradleException('Missing .githooks/pre-commit.')
        }
        if (!hook.canExecute() && !hook.setExecutable(true)) {
            throw new GradleException('Unable to mark .githooks/pre-commit as executable.')
        }

        def output = new ByteArrayOutputStream()
        def result = exec {
            commandLine 'git', 'config', '--local', '--get', 'core.hooksPath'
            standardOutput = output
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
        }
        if (result.exitValue != 0 && result.exitValue != 1) {
            throw new GradleException('Unable to read the local Git hooks path.')
        }

        def existingPath = output.toString('UTF-8').trim()
        if (existingPath && existingPath != '.githooks') {
            throw new GradleException("Local core.hooksPath is already '$existingPath'. Resolve it manually before installing template hooks.")
        }

        exec {
            commandLine 'git', 'config', '--local', 'core.hooksPath', '.githooks'
        }
        logger.lifecycle('Installed versioned Git hooks from .githooks/.')
    }
}

if (mixinEnabled) {
    minecraft.runs.configureEach {
        property 'mixin.env.remapRefMap', 'true'
        property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        args "--mixin.config=${mod_id}.mixins.json"
    }
    mixin {
        add sourceSets.main, "${mod_id}.refmap.json"
        config "${mod_id}.mixins.json"
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    if (mixinEnabled) {
        annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    }
}

def resourceProperties = [
        minecraft_version: minecraft_version,
        forge_version: forge_version,
        forge_loader_version_range: forge_loader_version_range,
        forge_dependency_version_range: forge_dependency_version_range,
        minecraft_version_range: minecraft_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_license: mod_license,
        mod_description: mod_description
]

processResources {
    inputs.properties resourceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand resourceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('printNetworkConfiguration') {
    group = 'help'
    description = 'Prints the effective template proxy configuration.'
    doLast {
        println "proxy.enabled=${gradle.ext.templateProxyEnabled}"
        println "proxy.host=${gradle.ext.templateProxyHost}"
        println "proxy.port=${gradle.ext.templateProxyPort}"
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title': mod_id,
                'Specification-Vendor': mod_authors,
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor': mod_authors
        ])
        if (mixinEnabled) {
            attributes 'MixinConfigs': "${mod_id}.mixins.json"
        }
    }
    finalizedBy 'reobfJar'
}
