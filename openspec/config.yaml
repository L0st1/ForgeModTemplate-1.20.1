schema: spec-driven

context: |
  本仓库是一套 Forge 1.20.1、Java 17、Gradle 8.8 的 Minecraft Mod 开发模板。
  项目身份和版本以 gradle.properties 为规范来源；资源元数据由 Gradle 展开生成。
  公共入口不得引用客户端专属类，服务端对游戏状态保持权威。
  模板默认代理为 127.0.0.1:7890，并通过本地覆盖配置支持修改或禁用。
  新建和维护的文档正文默认使用简体中文。

rules:
  proposal:
    - 明确说明变更是否影响初始化器、模板生成结果或技术基线。
  specs:
    - 需求和场景必须可通过脚本、构建、客户端或专用服务器验证。
  design:
    - 涉及客户端输入或游戏状态时必须说明端侧边界与服务端权威策略。
  tasks:
    - 任务按依赖顺序排列，并包含与风险相称的验证步骤。

operations:
  apply:
    guidance:
      - 删除旧模板内容前先验证可恢复迁移备份。
      - 区分源码失败、代理失败和依赖解析失败。
